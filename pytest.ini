[pytest]
# Root test configuration: covers the ML package and the API.
# AGENTS.md section 7 plans `pytest ml -q` for ML and `pytest -q` for the API.
testpaths = ml/tests apps/api/tbcare_api/tests
python_files = test_*.py
python_functions = test_*
# Make `ml`, `tbcare_api`, and the repo root importable from either suite.
pythonpath = . apps/api
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
