version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DEMO_ENABLED=true
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8080
      - DEMO_ENABLED=true
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    name: tbcare-local