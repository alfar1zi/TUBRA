version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DEMO_ENABLED=true
      # Local dev runs against the CANDIDATE manifest; opt in explicitly so the
      # new 503 gate does not block a developer exercising the full path.
      - DEPLOYMENT_ENV=staging
      - ALLOW_BLOCKED_CANDIDATE=true
      - TBCARE_ARTIFACTS=/app/ml/artifacts
    # The image already COPYs ml/artifacts (see apps/api/Dockerfile), so the
    # bind-mount is only a dev convenience: after retraining on the host, the
    # container picks up new artifacts without a rebuild. Comment it out for a
    # deploy that must run purely from the image contents.
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
    healthcheck:
      # python is guaranteed present in the image; curl is not installed, so a
      # curl-based check would always fail and block `web` (depends_on
      # service_healthy) from ever starting.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8080
      - DEMO_ENABLED=true
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    name: tbcare-local