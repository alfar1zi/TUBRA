[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tbcare-api"
version = "0.0.1"
dependencies = [
    "flask==3.0.3",
    "gunicorn==22.0.0",
    "numpy==1.26.4",
    "flask-cors==4.0.1",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tbcare_api/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]